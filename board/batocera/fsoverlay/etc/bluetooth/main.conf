[General]
ControllerMode = dual
JustWorksRepairing = always
# RGM: FastConnectable pone el page scan en modo interlaced con intervalo
# corto, y MultiProfile=multiple solo afecta a perfiles de audio. Ninguno de
# los dos lo define EmuELEC, que empareja los clones PS3 de esta caja sin
# problemas. Se dejan fuera para igualar ese comportamiento.
#MultiProfile=multiple
#FastConnectable = true

[Policy]
AutoEnable=true

# LE section for Xbox X|S controllers
# try uncommenting the below options
# as troubleshooting step only
[LE]
#MinConnectionInterval=7
#MaxConnectionInterval=9
#ConnectionLatency=0
