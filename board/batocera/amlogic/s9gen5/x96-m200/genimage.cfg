# The stock S7D u-boot does not read the 3G FAT32 Batocera partition (no
# aml_autoscript/cfgload found, it falls back to Android), while it boots
# CoreELEC's 512M FAT16 one. So the files u-boot needs live in a small
# FAT16 partition made like CoreELEC's, and Batocera keeps its usual FAT32
# boot partition (found by label from the initramfs) right after it:
#   p1 AMLBOOT (FAT16)  aml_autoscript, cfgload, kernel.img, dtb.img
#   p2 RETROGAMERS      Batocera boot partition (squashfs, overlay, conf)
#   p3 SHARE            userdata (batocera-part: share = boot + 1)

image amlboot.vfat {
	vfat {
		extraargs = "-F 16 -s 16 -n AMLBOOT"
		file aml_autoscript { image = "aml_autoscript" }
		file cfgload { image = "cfgload" }
		file cfgload_env { image = "cfgload_env" }
		file kernel.img { image = "kernel.img" }
		file dtb.img { image = "dtb.img" }
		file README.txt { image = "README.txt" }
		file device_trees/s7d_s905x5m_2g_1gbit_s905a.dtb { image = "device_trees/s7d_s905x5m_2g_1gbit_s905a.dtb" }
		file device_trees/s7d_s905a_bm221.dtb { image = "device_trees/s7d_s905a_bm221.dtb" }
		file device_trees/s7d_s905x5m_2g_1gbit.dtb { image = "device_trees/s7d_s905x5m_2g_1gbit.dtb" }
		file device_trees/s7d_s905x5m_2g.dtb { image = "device_trees/s7d_s905x5m_2g.dtb" }
		file device_trees/s7d_s905x5m_4g_1gbit.dtb { image = "device_trees/s7d_s905x5m_4g_1gbit.dtb" }
		file device_trees/s7d_s905x5m_4g.dtb { image = "device_trees/s7d_s905x5m_4g.dtb" }
	}
	size = 256M
}

image boot.vfat {
	vfat {
		extraargs = "-F 32 -n RETROGAMERS"
		@files
	}
	size = 3G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0"
	}
	size = "512M"
	# include files from TARGET_DIR/userdata
	mountpoint = "/userdata"
}

image batocera.img {
	hdimage {
		align = "1M"
	}

	# same start and type as CoreELEC's boot partition
	partition amlboot {
		partition-type = 0xC
		bootable = "true"
		image = "amlboot.vfat"
		offset = 8M
	}

	partition vfat {
		partition-type = 0xC
		image = "boot.vfat"
	}

	partition userdata {
		partition-type = 0x83
		image = "userdata.ext4"
	}
}
