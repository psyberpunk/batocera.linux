# s9gen5 (Amlogic S7D / S905X5M, Mali-G310 MC1) default values
#
# Single-core G310, same class as the s905gen3 Mali-G31 MC1: cap both
# EmulationStation and the emulators at the best mode <= 1920x1080, see
# sysconfigs/s905gen3/batocera.conf.
es.resolution=max-1920x1080
global.videomode=max-1920x1080
