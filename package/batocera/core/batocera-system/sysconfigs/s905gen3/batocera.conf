# s905gen3 (Amlogic SM1, Mali-G31 MC1) default values
#
# The GPU cannot drive 4K: on a 2160p TV EmulationStation idles at ~120% CPU
# and even SNES in RetroArch stutters (video_fullscreen_x=3840 + shader).
# Cap both ES and the emulators at the best mode <= 1920x1080: 720p on a 720p
# TV, 1080p on 1080p and 4K TVs.
#
# es.resolution is read by emulationstation-standalone through
# batocera-settings-get-master (boot conf first, then this file).
# global.videomode is appended to the userdata batocera.conf template by
# batocera-system.mk, because batocera-launch only reads batocera.conf.
es.resolution=max-1920x1080
global.videomode=max-1920x1080
